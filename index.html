<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Liberal Manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
  // Auto-route by browser language: the visitor's first matching preference wins
  // (Hebrew -> /he, Arabic -> /ar, English or anything else -> /en).
  // Falls back to the links below if JS is off.
  (function () {
    var prefs = navigator.languages || [navigator.language || navigator.userLanguage || ""];
    var target = "en/";
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).toLowerCase().split("-")[0];
      if (code === "he" || code === "iw") { target = "he/"; break; }
      if (code === "ar") { target = "ar/"; break; }
      if (code === "en") { target = "en/"; break; }
    }
    window.location.replace(target);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body>
  <main class="chooser">
    <h1>The Liberal Manifesto &nbsp;/&nbsp; המניפסט הליברלי &nbsp;/&nbsp; البيان الليبرالي</h1>
    <div class="links">
      <a href="en/">English</a>
      <a href="he/">עברית</a>
      <a href="ar/">العربية</a>
    </div>
  </main>
</body>
</html>
